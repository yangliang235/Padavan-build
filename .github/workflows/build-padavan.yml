# 源码基于 fightroad/Padavan-KVR (3.4内核，支持KVR)
# 集成：SmartDNS + KVR + CPU超频(内核级修复) + 中文 + USB(全套) + Shortcut-FE
# 版本号：_KEKE 全局替换为构建日期
name: Build Padavan (fightroad-KVR Full Featured)

on: 
  release:
    types: [published]
  push:
    tags:
    - 'v*'
  watch:
    types: [started]

jobs:
  build:
    runs-on: ubuntu-22.04
    if: github.event.repository.owner.id == github.event.sender.id

    steps:
    - name: Checkout
      uses: actions/checkout@master

    - name: Initialization environment
      env:
        DEBIAN_FRONTEND: noninteractive
      run: |
        sudo apt-get update
        sudo apt-get -y install unzip libtool-bin curl cmake gperf gawk flex bison nano xxd fakeroot \
        cpio git python3-docutils gettext automake autopoint texinfo build-essential help2man \
        pkg-config zlib1g-dev libgmp3-dev libmpc-dev libmpfr-dev libncurses5-dev libltdl-dev wget

    - name: Clone source code
      run: |
        git clone --depth=1 https://github.com/fightroad/Padavan-KVR.git /opt/rt-n56u
        cd /opt/rt-n56u/toolchain-mipsel
        sh dl_toolchain.sh
        mkdir -p /opt/images/

    - name: Build Firmware
      env:
        TNAME: NETGEAR-BZV
      run: |
        cd /opt/rt-n56u/trunk

        ################################################################################################
        # 修复一：强制修改内核 PLL 值 (880MHz -> 1000MHz)
        # 同时探测 rt2880 和 ralink 两种可能的路径
        ################################################################################################
        OC_DONE=false
        for INIT_C in "linux-3.4.x/arch/mips/rt2880/init.c" "linux-3.4.x/arch/mips/ralink/init.c"; do
          if [ -f "$INIT_C" ]; then
            sed -i 's/reg |= (0x2B2);/reg |= (0x312);/g' "$INIT_C"
            sed -i 's/reg |= (0x2b2);/reg |= (0x312);/g' "$INIT_C"
            sed -i 's/!= 0x2B2/!= 0x312/g' "$INIT_C"
            sed -i 's/!= 0x2b2/!= 0x312/g' "$INIT_C"
            echo "=== PLL replacement check in $INIT_C ==="
            grep -n "0x312\|0x2B2\|0x2b2" "$INIT_C" || echo "(no matching PLL line found)"
            OC_DONE=true
            break
          fi
        done
        if [ "$OC_DONE" = false ]; then
          echo "WARNING: init.c not found in both paths, OC may not work."
        fi

        ################################################################################################
        # 修复二：全局替换版本号后缀 _KEKE -> _当前日期
        ################################################################################################
        echo "=== Replacing _KEKE globally in trunk/ ==="
        grep -rl "_KEKE" trunk/ 2>/dev/null | while read file; do
          sed -i "s/_KEKE/_$(date +%Y%m%d)/g" "$file"
          echo "Modified: $file"
        done

        ################################################################################################
        # 加载配置文件：优先 templates，不存在则回退到 boards
        ################################################################################################
        CONFIG_FILE=""
        if [ -f "configs/templates/$TNAME.config" ]; then
          CONFIG_FILE="configs/templates/$TNAME.config"
        elif [ -f "configs/boards/$TNAME/kernel-3.4.x.config" ]; then
          CONFIG_FILE="configs/boards/$TNAME/kernel-3.4.x.config"
        fi

        if [ -z "$CONFIG_FILE" ]; then
          echo "ERROR: No config found for $TNAME in templates or boards."
          exit 1
        fi
        echo "Using config file: $CONFIG_FILE"
        cp -f "$CONFIG_FILE" .config

        ################################################################################################
        # 清理模板中的插件配置，避免冲突
        ################################################################################################
        sed -i '/CONFIG_FIRMWARE_INCLUDE_/d' .config
        sed -i '/CONFIG_RT_DOT11/d' .config
        sed -i '/CONFIG_FIRMWARE_ENABLE_USB/d' .config
        sed -i '/CONFIG_FIRMWARE_ENABLE_UFSD/d' .config
        sed -i '/CONFIG_FIRMWARE_ENABLE_FAT/d' .config
        sed -i '/CONFIG_FIRMWARE_ENABLE_EXT4/d' .config
        sed -i '/CONFIG_FIRMWARE_INCLUDE_SHORTCUT_FE/d' .config

        ################################################################################################
        # 核心功能
        ################################################################################################
        # SmartDNS
        echo "CONFIG_FIRMWARE_INCLUDE_SMARTDNS=y" >> .config
        echo "CONFIG_FIRMWARE_INCLUDE_SMARTDNSBIN=y" >> .config

        # 中文语言支持
        echo "CONFIG_FIRMWARE_INCLUDE_LANG_CN=y" >> .config

        # KVR (802.11k/v/r)
        echo "CONFIG_RT_DOT11K_RRM=y" >> .config
        echo "CONFIG_RT_DOT11V_RRM=y" >> .config
        echo "CONFIG_RT_DOT11R_FT=y" >> .config

        # CPU 超频开关（与内核修改配合，作为双重保险）
        echo "CONFIG_FIRMWARE_INCLUDE_OC=y" >> .config
        echo 'CONFIG_FIRMWARE_MT7621_OC="0x312"' >> .config # 1000MHz=0x312 / 1100MHz=0x362 / 1120MHz=0x372 / 1200MHz=0x3B2

        ################################################################################################
        # USB 基础支持与文件系统
        ################################################################################################
        echo "CONFIG_FIRMWARE_ENABLE_USB=y" >> .config
        echo "CONFIG_FIRMWARE_ENABLE_UFSD=y" >> .config   # NTFS
        echo "CONFIG_FIRMWARE_ENABLE_FAT=y" >> .config    # FAT/FAT32
        echo "CONFIG_FIRMWARE_ENABLE_EXT4=y" >> .config   # EXT4

        ################################################################################################
        # USB 应用
        ################################################################################################
        echo "CONFIG_FIRMWARE_INCLUDE_SMBD36=n" >> .config # 网上邻居
        echo "CONFIG_FIRMWARE_INCLUDE_FTPD=n" >> .config   # FTP 共享
        echo "CONFIG_FIRMWARE_INCLUDE_LPRD=y" >> .config   # LPR 打印机守护进程
        echo "CONFIG_FIRMWARE_INCLUDE_U2EC=y" >> .config   # USB-over-Ethernet 打印机
        echo "CONFIG_FIRMWARE_INCLUDE_USBIP=y" >> .config  # USB 网卡
        echo "CONFIG_FIRMWARE_INCLUDE_SERIAL=n" >> .config # USB-Serial
        echo "CONFIG_FIRMWARE_INCLUDE_UVC=n" >> .config    # USB 摄像头

        ################################################################################################
        # Shortcut-FE 加速
        ################################################################################################
        echo "CONFIG_FIRMWARE_INCLUDE_SHORTCUT_FE=y" >> .config

        ################################################################################################
        # 显式关闭其余所有不需要的插件
        ################################################################################################
        for opt in OPENSSL_EXE DNSFORWARDER MENTOHUST SCUTCLIENT SRELAY \
                   SHADOWSOCKS XRAY V2RAY TROJAN SSOBFS \
                   ADBYBY ADGUARDHOME ZEROTIER ALIDDNS DDNSTO ALDRIVER SQM; do
          echo "CONFIG_FIRMWARE_INCLUDE_${opt}=n" >> .config
        done

        #########################################################################################
        # 编译
        #########################################################################################
        sudo ./clear_tree
        sudo ./build_firmware_modify $TNAME 0
        sudo mv -f images/*.trx /opt/images/

    - name: Upload packages
      uses: actions/upload-artifact@master
      if: always()
      with:
        name: Padavan-packages
        path: /opt/images
